var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],
      [6, 34],
      [6, 22, 38],
      [6, 24, 42],
      [6, 26, 46],
      [6, 28, 50],
      [6, 30, 54],
      [6, 32, 58],
      [6, 34, 62],
      [6, 26, 46, 66],
      [6, 26, 48, 70],

</script><title>Gig Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one full-screen "drawing sheet". The world map is a paper cut-out laid on an ink grid;
   panels are paper cards pinned on top. TV = board + overlays. Phone = one card at a time. */
:root{
  --ink:#0A0C10; --ink-2:#121722; --ink-3:#1B2232; --grid:rgba(160,190,230,.07);
  --paper:#EEE7D8; --paper-2:#E2D8C3; --paper-shadow:#05070B; --paper-ink:#1D1A16;
  --light:#F1F4F7; --muted:#9AA6B8; --line:rgba(241,244,247,.14);
  --signal:#FF2D55;           /* CBC signal pink: used on ONE element, the "you are here" dot */
  --good:#8FD694; --bad:#F08A7E; --warn:#F2C14E;
  --f-display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --u:clamp(10px,1.05vmin + .35vmax,26px);
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--ink);color:var(--light);font-family:var(--f-body);font-size:var(--u);line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--light);outline-offset:3px;}
.mono{font-family:var(--f-mono);letter-spacing:.02em;}
.disp{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;line-height:1.02;}
[hidden]{display:none!important;}

/* ---------- map ---------- */
#stage{position:fixed;inset:0;}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;background:
  radial-gradient(120% 90% at 50% 40%,var(--ink-3),var(--ink) 70%);}
#map .shadow path{fill:var(--paper-shadow);opacity:.75;}
#map .land path{fill:var(--paper);stroke:var(--paper-2);stroke-width:.4;transition:fill .6s;}
#map .borders{fill:none;stroke:#B9AE98;stroke-width:.5;vector-effect:non-scaling-stroke;opacity:.8;}
#map .gridl{stroke:var(--grid);stroke-width:1;vector-effect:non-scaling-stroke;}
#map .arc{fill:none;stroke:var(--light);stroke-width:2;stroke-dasharray:6 6;vector-effect:non-scaling-stroke;opacity:.85;}
#map .pin-label{font-family:var(--f-mono);font-weight:700;fill:var(--paper-ink);paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round;}
#map .pin .disc{stroke:var(--paper-ink);stroke-width:1.4;vector-effect:non-scaling-stroke;}
#map .pin.dim{opacity:.35;}
#map .pin.hot .disc{stroke:var(--light);stroke-width:3;}
#map .tok circle.body{stroke:var(--paper-ink);stroke-width:1.5;vector-effect:non-scaling-stroke;}
#map .tok text{font-family:var(--f-display);font-weight:800;fill:var(--paper-ink);}
#map .here{fill:var(--signal);}
.sheet-tag{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);font-family:var(--f-mono);font-size:.55em;color:var(--muted);text-align:right;pointer-events:none;letter-spacing:.08em;}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;padding:calc(env(safe-area-inset-top,0px) + .8em) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + .8em) max(16px,env(safe-area-inset-left,0px));gap:.8em;}
#hud > *{pointer-events:auto;}
.topbar{display:flex;align-items:center;gap:1em;justify-content:space-between;}
.brand{display:flex;align-items:center;gap:.6em;}
.topbar .brand{background:rgba(10,12,16,.88);border:1px solid var(--line);border-radius:.4em;padding:.3em .8em .3em .5em;}
.brand .mark{width:1.8em;height:1.8em;}
.brand .name{font-size:1.5em;}
.brand .sub{font-family:var(--f-mono);font-size:.6em;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;}
.status{font-family:var(--f-mono);font-size:.7em;color:var(--muted);background:rgba(10,12,16,.88);border:1px solid var(--line);border-radius:.4em;padding:.35em .6em;display:flex;gap:1.2em;align-items:center;flex-wrap:wrap;justify-content:flex-end;}
.status b{color:var(--light);font-weight:700;}
.iconbtn{background:var(--ink-2);border:1px solid var(--line);border-radius:.4em;padding:.35em .7em;font-family:var(--f-mono);font-size:.95em;}
.mid{display:grid;grid-template-columns:minmax(12em,17em) 1fr;gap:1em;min-height:0;}
.rail{display:flex;flex-direction:column;gap:.5em;align-self:start;max-height:100%;overflow:auto;}
.pcard{background:var(--paper);color:var(--paper-ink);border-radius:.3em;padding:.5em .7em;box-shadow:.25em .3em 0 var(--paper-shadow);display:grid;grid-template-columns:auto 1fr auto;gap:.15em .6em;align-items:center;position:relative;transform:rotate(var(--tilt,0deg));transition:transform .3s;}
.pcard.turn{outline:3px solid var(--light);outline-offset:2px;}

<script>(() => {

/* ---------------- helpers ---------------- */
function h(tag, a, ...kids){
  const e = document.createElement(tag);
  if (a) for (const k in a){
    const v = a[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e && typeof v !== 'string') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
function s(tag, a, ...kids){
  const e = document.createElementNS(SVGNS, tag);
  if (a) for (const k in a){ if (a[k] != null) { if (k === 'text') e.textContent = a[k]; else e.setAttribute(k, a[k]); } }
  for (const k of kids.flat()) if (k) e.append(k);
  return e;
}
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const money = n => '$' + Math.round(n).toLocaleString('en-US');
function km(a, b){
  const R = 6371, t = Math.PI / 180;
  const dLat = (b.lat - a.lat) * t, dLon = (b.lon - a.lon) * t;
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem('ga.' + k)); localStorage.setItem('ga.' + k, JSON.stringify(v)); } catch { return null; } }

const COLORS = ['#F2A65A','#7FD1B9','#B39DDB','#F28CA0','#8EC5FF','#E8E288','#C9A27E','#9FE870','#FFB3D9','#6FD6F2'];

/* ---------------- sound (synthesized, no files) ---------------- */
const Sfx = {
  ctx: null, on: store('sound') !== false,
  init(){ if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  tone(f, d = .12, type = 'square', v = .05, f2){
    if (!this.on || !this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t + d + .02);
  },
  tick(){ this.tone(1400, .03, 'square', .025); },
  good(){ this.tone(523, .1, 'triangle', .07); setTimeout(() => this.tone(784, .16, 'triangle', .07), 90); },
  bad(){ this.tone(220, .25, 'sawtooth', .04, 110); },
  stamp(){ this.tone(90, .18, 'sine', .2, 40); setTimeout(() => this.tone(1200, .05, 'square', .03), 60); },

/* ---------------- networking ----------------
   1) Inside a claude.ai Artifact: the `room` capability. Phones send their input as presence
      (anyone may set presence); the TV host broadcasts the board state on the "state" topic.
   2) Same browser (other tabs/windows): BroadcastChannel. Good for testing and laptop couch play. */
const Net = {
  room: null, named: null, bc: null, role: null, code: null, ready: false,
  peer: null, conns: new Set(), hostConn: null, web: false, webErr: null,
  /* 3) Anywhere on the web: PeerJS (WebRTC). The TV registers as peer "gigatlas-<code>" on the free
        PeerJS signaling server; phones connect straight to it. No accounts, no game server. */
  peerOpts(){
    const q = new URLSearchParams(location.search).get('ps'); // ?ps=host:port for a self-hosted PeerServer (testing)
    if (q) { const [host, port] = q.split(':'); return {host, port: +port || 9000, path: '/', secure: location.protocol === 'https:' && host !== 'localhost', debug: 0}; }
    return {debug: 0};
  },
  peerId(code){ return 'gigatlas-v1-' + code.toLowerCase(); },

    if (!window.Peer || this.room) return;

    const peer = this.peer = role === 'host' ? new Peer(this.peerId(code), this.peerOpts()) : new Peer(this.peerOpts());
    this.webErr = null;
    peer.on('open', () => {
      if (peer !== this.peer) return;
      this.web = true; this.webErr = null;
      if (role === 'phone') this.dialHost();
      this.onRoomChange && this.onRoomChange();
    });

      if (role !== 'host') return conn.close();
      conn.on('open', () => { this.conns.add(conn); this.onJoin && this.onJoin(); });
      conn.on('data', d => this._msg(d));
      const drop = () => this.conns.delete(conn);
      conn.on('close', drop); conn.on('error', drop);
    });
    peer.on('disconnected', () => { if (peer === this.peer && !peer.destroyed) setTimeout(() => { try { peer.reconnect(); } catch {} }, 1500); });
    peer.on('error', e => {
      if (peer !== this.peer) return;
      const t = e && e.type;
      if (t === 'unavailable-id' && role === 'host') { this.onCodeTaken && this.onCodeTaken(); return; }
      if (t === 'peer-unavailable') { this.webErr = 'tv'; setTimeout(() => this.dialHost(), 3000); }
      else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') { this.webErr = 'net'; }
      else this.webErr = t || 'error';

  dialHost(){

    conn.on('data', d => this._msg(d));
    conn.on('close', () => { if (conn === this.hostConn) { this.hostConn = null; setTimeout(() => this.dialHost(), 2000); this.onRoomChange && this.onRoomChange(); } });
  },
  webLive(){ return this.role === 'host' ? this.web : !!(this.hostConn && this.hostConn.open); },
  onState: null, onPresence: null, onJoin: null, onLeave: null, onRoomChange: null,

    try {

    } catch (e) { console.warn('room unavailable', e); }

  },
  async open(code, role){

  if (!activeOk && !coopCarry) Term.say(MAPA, pick(['Otra vez será. Next time.', 'Tranquilo. You can come back.', 'Ni modo.']));

function regionTally(st){ return regionsOf(st).size; }

/* host-side input router */
function onInput(pid, inp){
  if (!inp || typeof inp !== 'object') return;
  const p = P(pid); if (!p) return;
  const t = inp.type, v = inp.val, isActive = active() && active().id === pid;
  if (t === 'answer') return answer(pid, Number(v));
  if (t === 'wild') return useWild(pid, v);
  if (t === 'liner') return linerNote(pid, v);
  if (!isActive) return;
  if (t === 'spin' && G.phase === 'turn') return doSpin(v && REG[v] ? v : null);
  if (t === 'dest' && G.phase === 'dest') return chooseDest(String(v));
  if (t === 'tier' && G.phase === 'tier') {
    const tier = Number(v); if (![1, 2, 3].includes(tier)) return;
    if (G.ctx.jet && tier === 3) return; if (qUsed(G.ctx.city, tier)) return;
    Term.sys(`${TIER[tier].name.toUpperCase()} SET. ${TIER[tier].pts} PTS.`);
    return askGig(G.ctx.city, tier);
  }
  if (t === 'next' && (G.phase === 'reveal')) return endTurn();
}

const Confetti = {
  go(){
    const cv = $('#confetti'), x = cv.getContext('2d'); cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
    const bits = Array.from({length: 160}, () => ({x: Math.random() * cv.width, y: -Math.random() * cv.height, w: 6 + Math.random() * 10, h: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .2, vy: 2 + Math.random() * 3, vx: (Math.random() - .5) * 2, c: pick(COLORS.concat(['#EEE7D8']))}));

      for (const b of bits){ b.y += b.vy * devicePixelRatio; b.x += b.vx; b.r += b.vr; x.save(); x.translate(b.x, b.y); x.rotate(b.r); x.fillStyle = b.c; x.fillRect(-b.w / 2, -b.h / 2, b.w * devicePixelRatio, b.h * devicePixelRatio); x.restore(); }

        add(h('h3', {text: 'Layover · liner notes'}), h('h2', {text: o.p}), sent ? h('p', {text: 'Pinned to the board. Watch the TV.'}) :
          h('form', {onsubmit: e => { e.preventDefault(); if (ta.value.trim()) this.send({type: 'liner', val: ta.value.trim()}); }}, ta, h('button', {class: 'btn big', type: 'submit', style: 'margin-top:.6em;width:100%', text: 'Pin it'})));
        break; }
      case 'linerShow': add(h('h3', {text: 'Liner notes'}), h('h2', {text: 'Read them on the TV'})); break;
      case 'end': add(h('h3', {text: 'Game over'}), h('h2', {text: o.win ? PARTY : 'The afterparty'}), h('p', {text: o.who === this.me.pid ? 'You are the ultimate party thrower.' : 'See the playlist on the TV.'})); break;

function wheelSvg(){
  const n = C.regions.length, R = 100;
  const g = s('g', {id: 'wheel'});
  C.regions.forEach((r, i) => {
    const a0 = (i / n) * Math.PI * 2 - Math.PI / 2, a1 = ((i + 1) / n) * Math.PI * 2 - Math.PI / 2;
    const p = `M0,0 L${R * Math.cos(a0)},${R * Math.sin(a0)} A${R},${R} 0 0 1 ${R * Math.cos(a1)},${R * Math.sin(a1)} Z`;
    g.append(s('path', {d: p, fill: r.hue, stroke: '#1D1A16', 'stroke-width': 1.5}));
    const am = (a0 + a1) / 2, tx = Math.cos(am) * 62, ty = Math.sin(am) * 62;
    g.append(s('text', {x: tx, y: ty, 'text-anchor': 'middle', 'dominant-baseline': 'middle', 'font-size': 11, 'font-family': 'JetBrains Mono, monospace', 'font-weight': 700, fill: '#1D1A16', transform: `rotate(${am * 180 / Math.PI + 90} ${tx} ${ty})`, text: r.short}));
  });
  g.append(s('circle', {r: 16, fill: '#EEE7D8', stroke: '#1D1A16', 'stroke-width': 2}), s('circle', {r: 4, fill: '#1D1A16'}));
  const svg = s('svg', {viewBox: '-106 -106 212 212'}, s('circle', {r: 104, fill: '#1D1A16'}), g);
  return svg;
}

}
function timerBar(ctx){

(function loop(){
  for (const b of document.querySelectorAll('.timer > i[data-ends]')){
